<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="17.2362mm"
   height="5.8741317mm"
   viewBox="0 0 17.2362 5.8741317"
   version="1.1"
   id="svg3"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <!--
    マリンバA(5オクターブ)派生。原本の作図スケール(1単位≒118mm)と高音側端部の
    寸法を保ったまま、全長と低音側端部だけを4オクターブ機(YM-4100A級 2030x870mm)へ合わせた。
    低音側 5.74369単位 = 6.8単位 x 870/1030、全長 17.1112単位 = 22.000017単位 x 2030/2610。

    原本のような symbol/use 経由では描かない。symbolは参照時に独自のビューポートを作り
    既定でその外側を切り取るため、原本では右端と低音側の底辺が欠けて別途補完線が要る。
    ここでは外形を単一のclosed pathで直接描き、四辺すべてを線として出す。
  -->
  <g
     id="Group-marimba-4oct"
     style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.125;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1">
    <path
       id="marimba-4oct-body"
       shape-rendering="crispEdges"
       d="M 17.1737,5.80619 L 17.1737,0.0625 L 0.0625,1.341356 L 0.0625,4.671966 Z" />
  </g>
</svg>
