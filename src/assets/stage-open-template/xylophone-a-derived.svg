<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="16.125017mm"
   height="5.7311916mm"
   viewBox="0 0 16.125017 5.7311914"
   version="1.1"
   id="svg3"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <!--
    シロフォンA原本の外形。頂点座標は原本のまま。
    原本の translate(-0.302083,-0.29588853) を各頂点へ畳み込み、viewBox内へ収めてある。
    全長16.000017単位、低音側5.599997単位、高音側2.74286単位。

    原本のような symbol/use 経由では描かない。symbolは参照時に独自のビューポートを作り
    既定でその外側を切り取るため、右辺が丸ごと、上辺・下辺は低音側の先端が欠けていた。
    補完線(right-edge-repair)は右辺だけを埋めるもので、上辺・下辺の欠けは残っていた。
    ここでは外形を単一のclosed pathで直接描き、四辺すべてを途切れなく出す。
  -->
  <g
     id="Group-xylophone-a"
     style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.125;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1">
    <path
       id="xylophone-a-body"
       shape-rendering="crispEdges"
       d="M 16.062517,5.66869147 L 16.062517,0.06869447 L 0.0625,1.58298147 L 0.0625,4.32584147 Z" />
  </g>
</svg>
