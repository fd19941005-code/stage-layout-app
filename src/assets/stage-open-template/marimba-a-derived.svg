<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="22.125017mm"
   height="6.9304385mm"
   viewBox="0 0 22.125017 6.9304385"
   version="1.1"
   id="svg3"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <!--
    マリンバA原本(5オクターブ)の外形。頂点座標は原本のまま。
    原本の translate(-0.302083,-0.29664128) を各頂点へ畳み込み、viewBox内へ収めてある。
    全長22.000017単位、低音側6.799997単位、高音側3.33061単位。

    原本のような symbol/use 経由では描かない。symbolは参照時に独自のビューポートを作り
    既定でその外側を切り取るため、右辺が丸ごと、上辺・下辺は低音側の先端が欠けていた。
    補完線(right-edge-repair)は右辺だけを埋めるもので、上辺・下辺の欠けは残っていた。
    ここでは外形を単一のclosed pathで直接描き、四辺すべてを途切れなく出す。
    4オクターブ版(marimba-4oct-a.svg)も同じ構造で作図している。
  -->
  <g
     id="Group-marimba-a"
     style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.125;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1">
    <path
       id="marimba-a-body"
       shape-rendering="crispEdges"
       d="M 22.062517,6.86793872 L 22.062517,0.06794172 L 0.0625,1.90671872 L 0.0625,5.23732872 Z" />
  </g>
</svg>
