<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="11.125017mm"
   height="6.0871668mm"
   viewBox="0 0 11.125017 6.0871668"
   version="1.1"
   id="svg3"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <!--
    グロッケンシュピールA原本の外形(矩形)。頂点座標は原本のまま。
    原本の translate(-0.302083,-0.302083) を各頂点へ畳み込み、viewBox内へ収めてある。
    全長11.000017単位、奥行5.962167単位。

    原本のような symbol/use 経由では描かない。symbolは参照時に独自のビューポートを作り
    既定でその外側を切り取るため、右辺と下辺が欠けて補完線を2本(right-edge-repair /
    bottom-edge-repair)足してあった。補完線は本来の辺よりわずかに内側を通るため、
    外形がその分だけ小さく描かれていた。
    ここでは外形を単一のclosed pathで直接描き、四辺を原本どおりの位置で出す。
  -->
  <g
     id="Group-glockenspiel-a"
     style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.125;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1">
    <path
       id="glockenspiel-a-body"
       shape-rendering="crispEdges"
       d="M 0.0625,6.024667 L 0.0625,0.0625 L 11.062517,0.0625 L 11.062517,6.024667 Z" />
  </g>
</svg>
